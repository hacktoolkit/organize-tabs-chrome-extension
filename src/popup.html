<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Organize Tabs</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
    <header class="head">
        <img src="../img/icon32.png" alt="" width="20" height="20" />
        <div class="head-text">
            <h1>Organize Tabs</h1>
            <div id="stats" class="stats muted">Counting tabs…</div>
        </div>
        <button id="help-toggle" class="ghost icon" title="Show descriptions" aria-label="Toggle help">?</button>
    </header>

    <main id="main">
        <div id="actions"></div>
    </main>

    <section id="panel" class="panel" hidden>
        <div class="panel-head">
            <div id="panel-title" class="panel-title"></div>
            <button id="panel-close" class="ghost icon" aria-label="Close">×</button>
        </div>
        <div id="panel-body"></div>
        <div class="panel-foot">
            <button id="panel-cancel">Cancel</button>
            <button id="panel-confirm" class="danger">Close tabs</button>
        </div>
    </section>

    <footer class="foot">
        <button id="undo" class="ghost" hidden>Undo</button>
        <span class="spacer"></span>
        <a href="#" id="customize" title="Reorder sections and actions, pick favorites">Customize</a>
        <a href="#" id="open-options">Settings</a>
        <a href="https://github.com/hacktoolkit/organize-tabs-chrome-extension#readme" target="_blank" rel="noopener">Help</a>
    </footer>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="popup.js"></script>
</body>
</html>
